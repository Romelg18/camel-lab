<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Apache Camel - File Transfer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#05050a',
                        panelbg: '#0f0f16',
                        inputbg: '#14141f',
                        neoncyan: '#00f0ff',
                        neonpurple: '#b026ff',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #05050a; color: #a1a1aa; }
        .neon-border-cyan { border: 1px solid rgba(0, 240, 255, 0.3); box-shadow: 0 0 10px rgba(0, 240, 255, 0.1); }
        .neon-border-purple { border: 1px solid rgba(176, 38, 255, 0.4); box-shadow: 0 0 15px rgba(176, 38, 255, 0.15); }
        .input-field { background-color: #14141f; border: 1px solid #27273a; color: #e4e4e7; transition: all 0.3s ease; }
        .input-field:focus { outline: none; border-color: #00f0ff; box-shadow: 0 0 8px rgba(0, 240, 255, 0.2); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f0f16; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #27273a; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-6xl space-y-6">
        
        <!-- Header / Diagram -->
        <div class="bg-panelbg rounded-xl p-6 border border-zinc-800 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-neoncyan to-neonpurple"></div>
            
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 relative z-10">
                <!-- Box 1 -->
                <div class="input-field rounded-lg p-5 flex-1 w-full text-center">
                    <svg class="w-6 h-6 mx-auto mb-2 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <h3 class="text-zinc-200 font-semibold text-sm tracking-wide">Sistema de ventas</h3>
                    <p class="text-xs text-zinc-500 mt-1 font-mono">exporta /input/ventas.csv</p>
                </div>

                <!-- Arrow -->
                <div class="hidden md:block text-neoncyan animate-pulse">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </div>

                <!-- Box 2 -->
                <div class="bg-[#1a0b2e] neon-border-purple rounded-lg p-5 flex-1 w-full text-center relative">
                    <svg class="w-6 h-6 mx-auto mb-2 text-neonpurple" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <h3 class="text-white font-semibold text-sm tracking-wide">Apache Camel</h3>
                    <p class="text-xs text-purple-300 mt-1 font-mono">file:input → proceso → file:output</p>
                </div>

                <!-- Arrow -->
                <div class="hidden md:block text-neoncyan animate-pulse">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </div>

                <!-- Box 3 -->
                <div class="input-field rounded-lg p-5 flex-1 w-full text-center">
                    <svg class="w-6 h-6 mx-auto mb-2 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                    <h3 class="text-zinc-200 font-semibold text-sm tracking-wide">Carpeta output</h3>
                    <p class="text-xs text-zinc-500 mt-1 font-mono">archivo preparado para inventario</p>
                </div>
            </div>
        </div>

        <!-- Main Panels -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Entrada Panel -->
            <div class="bg-panelbg border border-zinc-800 rounded-xl flex flex-col shadow-lg overflow-hidden">
                <div class="p-4 border-b border-zinc-800 flex justify-between items-center bg-[#0a0a10]">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-neoncyan"></div>
                        <h2 class="text-zinc-100 font-semibold tracking-wide text-sm">Entrada</h2>
                    </div>
                    <span class="text-xs text-neoncyan font-mono bg-cyan-950/30 px-2 py-1 rounded">/input</span>
                </div>
                
                <div class="p-5 flex-1 flex flex-col gap-4">
                    <div>
                        <label class="block text-xs text-zinc-500 mb-1.5 uppercase tracking-wider font-semibold">Nombre del archivo</label>
                        <input type="text" id="fileName" value="ventas.csv" class="w-full input-field text-sm rounded p-2.5 font-mono">
                    </div>
                    
                    <div class="flex-1 flex flex-col">
                        <label class="block text-xs text-zinc-500 mb-1.5 uppercase tracking-wider font-semibold">Contenido editable</label>
                        <textarea id="fileContent" rows="6" class="w-full flex-1 input-field text-sm rounded p-3 font-mono custom-scrollbar resize-none">id,producto,cantidad,precio
1,Monitor,2,150
2,Teclado,5,25
3,Mouse,3,15</textarea>
                    </div>
                </div>
            </div>

            <!-- Salida Panel -->
            <div class="bg-panelbg border border-zinc-800 rounded-xl flex flex-col shadow-lg overflow-hidden">
                <div class="p-4 border-b border-zinc-800 flex justify-between items-center bg-[#0a0a10]">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-neonpurple"></div>
                        <h2 class="text-zinc-100 font-semibold tracking-wide text-sm">Salida</h2>
                    </div>
                    <span class="text-xs text-neonpurple font-mono bg-purple-900/20 px-2 py-1 rounded">/output</span>
                </div>
                
                <div class="p-5 flex-1 flex flex-col gap-4">
                    <div>
                        <label class="block text-xs text-zinc-500 mb-1.5 uppercase tracking-wider font-semibold">Archivo generado</label>
                        <div id="outFileName" class="text-sm text-zinc-600 font-mono h-9 flex items-center bg-inputbg px-3 rounded border border-zinc-800">Ninguno todavía</div>
                    </div>
                    
                    <div class="flex-1 flex flex-col">
                        <label class="block text-xs text-zinc-500 mb-1.5 uppercase tracking-wider font-semibold">Contenido resultante</label>
                        <div id="outContent" class="w-full flex-1 input-field text-sm rounded p-4 font-mono custom-scrollbar overflow-y-auto whitespace-pre-wrap flex items-center justify-center text-zinc-600">
                            Esperando ejecución de ruta...
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Controls -->
        <div class="flex flex-wrap items-center gap-3 pt-2">
            <button onclick="ejecutar()" class="bg-neoncyan hover:bg-[#00d0dd] text-black font-bold py-2.5 px-6 rounded shadow-[0_0_15px_rgba(0,240,255,0.4)] transition-all flex items-center gap-2 text-sm uppercase tracking-wider">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Ejecutar Integración
            </button>
            
            <button onclick="probarIncompletos()" class="bg-transparent hover:bg-purple-900/30 text-neonpurple border border-neonpurple/50 py-2.5 px-5 rounded transition-colors flex items-center gap-2 text-sm font-medium">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                Probar datos incompletos
            </button>

            <button onclick="probarTxt()" class="bg-transparent hover:bg-zinc-800 text-zinc-300 border border-zinc-700 py-2.5 px-5 rounded transition-colors flex items-center gap-2 text-sm font-medium">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Probar archivo .txt
            </button>
            
            <button onclick="reiniciar()" class="text-zinc-500 hover:text-zinc-300 py-2.5 px-4 rounded transition-colors flex items-center gap-2 text-sm font-medium ml-auto">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Reiniciar
            </button>
        </div>
        
    </div>

    <script>
        const defaultCSV = "id,producto,cantidad,precio\n1,Monitor,2,150\n2,Teclado,5,25\n3,Mouse,3,15";
        const incompleteCSV = "id,producto,cantidad,precio\n1,Monitor,,150\n2,,5,25\n3,Mouse,3,";
        const defaultTXT = "Log de sistema.\nNo procesar esta informacion.\nConfidencial.";

        function ejecutar() {
            const fileName = document.getElementById('fileName').value.trim();
            const content = document.getElementById('fileContent').value;
            const outFileName = document.getElementById('outFileName');
            const outContent = document.getElementById('outContent');

            // Simular carga
            outContent.innerHTML = '<div class="flex flex-col items-center gap-3"><div class="w-6 h-6 border-2 border-neonpurple border-t-transparent rounded-full animate-spin"></div><span class="text-neonpurple text-xs tracking-widest uppercase">Procesando...</span></div>';
            outContent.classList.replace('items-start', 'items-center');
            
            setTimeout(() => {
                if (fileName.toLowerCase().endsWith('.csv')) {
                    outFileName.textContent = fileName;
                    outFileName.className = "text-sm text-neoncyan font-mono h-9 flex items-center bg-inputbg px-3 rounded border border-cyan-900";
                    
                    outContent.textContent = content.toUpperCase();
                    outContent.className = "w-full flex-1 input-field text-white text-sm rounded p-4 font-mono custom-scrollbar overflow-y-auto whitespace-pre-wrap flex items-start justify-start border-neoncyan shadow-[inset_0_0_10px_rgba(0,240,255,0.1)]";
                } else {
                    outFileName.textContent = "IGNORADO_POR_FILTRO";
                    outFileName.className = "text-sm text-red-400 font-mono h-9 flex items-center bg-red-950/20 px-3 rounded border border-red-900/50";
                    
                    outContent.innerHTML = `
                        <div class="flex flex-col items-center gap-2 text-center">
                            <span class="text-red-500 font-bold tracking-widest text-lg">ACCESO DENEGADO</span>
                            <span class="text-zinc-400 text-xs mt-1">Filtro activo: <span class="text-purple-400">.filter(header("CamelFileName").endsWith(".csv"))</span><br><br>El archivo no cumple con el formato requerido.</span>
                        </div>
                    `;
                    outContent.className = "w-full flex-1 input-field rounded p-4 flex items-center justify-center border border-red-900/50 bg-red-950/10";
                }
            }, 500);
        }

        function probarIncompletos() {
            document.getElementById('fileName').value = 'ventas_error.csv';
            document.getElementById('fileContent').value = incompleteCSV;
            resetOutputUI();
        }

        function probarTxt() {
            document.getElementById('fileName').value = 'config.txt';
            document.getElementById('fileContent').value = defaultTXT;
            resetOutputUI();
        }

        function reiniciar() {
            document.getElementById('fileName').value = 'ventas.csv';
            document.getElementById('fileContent').value = defaultCSV;
            resetOutputUI();
        }

        function resetOutputUI() {
            document.getElementById('outFileName').textContent = 'Ninguno todavía';
            document.getElementById('outFileName').className = "text-sm text-zinc-600 font-mono h-9 flex items-center bg-inputbg px-3 rounded border border-zinc-800";
            
            const outContent = document.getElementById('outContent');
            outContent.textContent = 'Esperando ejecución de ruta...';
            outContent.className = "w-full flex-1 input-field text-sm rounded p-4 font-mono custom-scrollbar overflow-y-auto whitespace-pre-wrap flex items-center justify-center text-zinc-600";
        }
    </script>
</body>
</html>
